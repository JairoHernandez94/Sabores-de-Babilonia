{% extends "base.html" %}
{% block title %}Ingreso{% endblock %}
{% block content %}
<section class="auth">
  <img class="auth-logo" src="{{ url_for('static', filename='img/logo.png') }}" alt="">
  <h1>Bienvenido de nuevo</h1>
  <form method="post" class="form" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Correo<input type="email" name="email" required autocomplete="email"></label>
    <label>Contraseña<input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn btn-primary btn-block" type="submit"><span>Ingresar</span></button>
  </form>
  <p class="alt">¿Aún no tienes cuenta? <a href="{{ url_for('registro') }}">Regístrate</a></p>
</section>
{% endblock %}
